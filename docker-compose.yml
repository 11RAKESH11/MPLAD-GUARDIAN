version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/app/mplad.db
      - JWT_SECRET=mplad-guardian-sih2026-production-secret
      - PORT=8000
    volumes:
      - ./mplad.db:/app/mplad.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: mplad-guardian-net
