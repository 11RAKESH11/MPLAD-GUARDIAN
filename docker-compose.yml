version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: mplad-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mplad_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    # Only expose port locally if needed for development/migration scripts
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-mplad_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal-net

  redis:
    image: redis:7-alpine
    container_name: mplad-redis
    command: redis-server --save 60 1 --loglevel warning --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - redisdata:/data
    # Redis is purely internal - never exposed to public host
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mplad-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-mplad_db}
      - DATABASE_PATH=/app/mplad.db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000}
      - PORT=8000
    volumes:
      - ./mplad.db:/app/mplad.db:ro # Read-only fallback mount
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: mplad-worker
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-mplad_db}
      - DATABASE_PATH=/app/mplad.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./mplad.db:/app/mplad.db:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: mplad-ai-service
    environment:
      - ENVIRONMENT=production
      - PORT=8001
    expose:
      - "8001"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: mplad-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  internal-net:
    name: mplad-guardian-internal-net
    driver: bridge
