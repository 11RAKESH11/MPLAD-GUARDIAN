# MPLAD GUARDIAN — Production Docker Compose Stack
# Compatible with Docker Compose v2 (no version field needed)

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: mplad-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mplad_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    # Expose only on localhost for migration scripts; not public
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-mplad_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal-net

  redis:
    image: redis:7-alpine
    container_name: mplad-redis
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redisdata:/data
    # Redis is purely internal - never exposed to public host
    expose:
      - "6379"
    healthcheck:
      # Use AUTH only when password is set
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mplad-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - ENABLE_DOCS=${ENABLE_DOCS:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-mplad_db}
      - DATABASE_PATH=/app/mplad.db
      - DB_POOL_MIN=${DB_POOL_MIN:-2}
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - DB_CONNECT_TIMEOUT=${DB_CONNECT_TIMEOUT:-10}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000}
      - AI_SERVICE_URL=http://ai-service:8001
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./mplad.db:/app/mplad.db:ro  # Read-only SQLite fallback mount
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: mplad-worker
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-mplad_db}
      - DATABASE_PATH=/app/mplad.db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
    volumes:
      - ./mplad.db:/app/mplad.db:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: mplad-ai-service
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=8001
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: mplad-frontend
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  internal-net:
    name: mplad-guardian-internal-net
    driver: bridge
